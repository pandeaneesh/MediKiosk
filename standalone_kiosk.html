    // Synthesized Audio Chime
    const playChime = (freq = 600, duration = 0.08) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    // Explicit Female Indian Voice Filter
    const isMaleVoice = (v) => {
      const name = (v.name || '').toLowerCase();
      return name.includes('male') || name.includes('madhur') || name.includes('david') || 
             name.includes('mark') || name.includes('ravi') || name.includes('hemant') || 
             name.includes('prabhat') || name.includes('george') || name.includes('guy') ||
             name.includes('richard') || name.includes('stefan');
    };

    const isFemaleVoice = (v) => {
      const name = (v.name || '').toLowerCase();
      return name.includes('female') || name.includes('swara') || name.includes('aarohi') || 
             name.includes('kalpana') || name.includes('neerja') || name.includes('heera') || 
             name.includes('zira') || name.includes('kavya') || name.includes('priya') ||
             name.includes('sangeeta') || name.includes('sunita') || name.includes('veena');
    };

    // Browser Web Speech API Voice Selector
    const getBestVoice = (language) => {
      if (!('speechSynthesis' in window)) return null;
      const allVoices = window.speechSynthesis.getVoices();
      if (!allVoices || allVoices.length === 0) return null;

      const femaleCandidates = allVoices.filter(v => !isMaleVoice(v));
      const voices = femaleCandidates.length > 0 ? femaleCandidates : allVoices;

      if (language === 'marathi') {
        const mrFemale = voices.find(v => 
          (v.lang.toLowerCase().startsWith('mr') || v.name.toLowerCase().includes('marathi') || v.name.toLowerCase().includes('aarohi'))
        ) || allVoices.find(v => v.lang.toLowerCase().startsWith('mr'));
        if (mrFemale) return mrFemale;

        const inDevanagari = voices.find(v => 
          (v.lang.toLowerCase().startsWith('hi') || v.name.toLowerCase().includes('hindi')) &&
          (v.name.toLowerCase().includes('swara') || v.name.toLowerCase().includes('kalpana') || isFemaleVoice(v))
        ) || allVoices.find(v => v.lang.toLowerCase().startsWith('hi'));
        if (inDevanagari) return inDevanagari;

        const inEn = voices.find(v => v.lang.toLowerCase().includes('en-in') || v.name.toLowerCase().includes('india'));
        if (inEn) return inEn;

      } else if (language === 'hindi') {
        const hiFemale = voices.find(v => 
          (v.lang.toLowerCase().startsWith('hi') || v.name.toLowerCase().includes('hindi')) &&
          (v.name.toLowerCase().includes('swara') || v.name.toLowerCase().includes('kalpana') || isFemaleVoice(v))
        ) || allVoices.find(v => v.lang.toLowerCase().startsWith('hi'));
        if (hiFemale) return hiFemale;

      } else {
        const enFemale = voices.find(v => 
          (v.lang.toLowerCase().includes('en-in') || v.name.toLowerCase().includes('india') || v.lang.toLowerCase().startsWith('en')) &&
          (v.name.toLowerCase().includes('neerja') || v.name.toLowerCase().includes('heera') || v.name.toLowerCase().includes('zira') || isFemaleVoice(v))
        ) || allVoices.find(v => v.lang.toLowerCase().includes('en-in') || v.lang.toLowerCase().startsWith('en'));
        if (enFemale) return enFemale;
      }

      return voices[0] || null;
    };

    // Universal Audio Stream Fallback (Guarantees Native Marathi & Hindi Audio on ANY Phone/PC)
    const playUniversalAudioStream = (text, language, onStart, onEnd) => {
      try {
        const langCode = language === 'marathi' ? 'mr' : language === 'hindi' ? 'hi' : 'en-IN';
        const cleanText = encodeURIComponent(text.slice(0, 190));
        const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${langCode}&client=tw-ob&q=${cleanText}`;

        const audio = new Audio(audioUrl);
        audio.playbackRate = language === 'marathi' ? 0.95 : 1.0;
        currentAudioElement = audio;

        audio.onplay = () => {
          onStart();
        };

        audio.onended = () => {
          currentAudioElement = null;
          onEnd();
        };

        audio.onerror = (err) => {
          console.warn("Online audio stream error, trying browser speech synthesis:", err);
          currentAudioElement = null;
          speakWithBrowserUtterance(text, language, onStart, onEnd);
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch((e) => {
            console.warn("Audio autoplay blocked, using browser speech synthesis:", e);
            speakWithBrowserUtterance(text, language, onStart, onEnd);
          });
        }

        console.warn("Universal stream exception:", err);
        speakWithBrowserUtterance(text, language, onStart, onEnd);
      }
    };

    const speakWithBrowserUtterance = (text, language, onStart, onEnd) => {
      if (!('speechSynthesis' in window)) {

        return;
      }

      try {
        window.speechSynthesis.cancel();
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }

        const u = new SpeechSynthesisUtterance(text);

        if (language === 'hindi') {
          u.lang = 'hi-IN';
          u.rate = 0.88;
          u.pitch = 1.18;
        } else if (language === 'marathi') {
          u.lang = 'mr-IN';
          u.rate = 0.85;
          u.pitch = 1.18;
        } else {
          u.lang = 'en-IN';
          u.rate = 0.90;
          u.pitch = 1.16;
        }

        const voice = getBestVoice(language);
        if (voice) {
          u.voice = voice;
        }

        u.onstart = onStart;
        u.onend = onEnd;
        u.onerror = () => {
          onEnd();
        };

      }

    // Touch Numpad Component
    const TouchNumpad = ({ value, onChange, maxLength = 14, formatType = 'abha' }) => {
      const handleDigit = (d) => {
        playChime(600);
        const raw = value.replace(/[\s-]/g, '');
        if (raw.length >= maxLength) return;
        const newRaw = raw + d;
        formatAndSet(newRaw);
      };

      const handleBackspace = () => {
        playChime(500);
        const raw = value.replace(/[\s-]/g, '');
        if (!raw.length) return;
        formatAndSet(raw.slice(0, -1));
      };

      const handleClear = () => {
        playChime(400);
        onChange('');
      };

      const formatAndSet = (raw) => {
        if (formatType === 'abha') {
          const trunc = raw.slice(0, 14);
          let f = '';
          for (let i = 0; i < trunc.length; i++) {
            if (i === 2 || i === 6 || i === 10) f += '-';
            f += trunc[i];
          }
          onChange(f);
        } else if (formatType === 'aadhaar') {
          const trunc = raw.slice(0, 12);
          let f = '';
          for (let i = 0; i < trunc.length; i++) {
            if (i > 0 && i % 4 === 0) f += ' ';
            f += trunc[i];
          }
          onChange(f);
        } else {
          onChange(raw);
        }
      };

      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'];

      return (
        <div className="bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-slate-700 shadow-2xl">
          <div className="flex items-center justify-between mb-3 px-1 text-slate-300 text-xs font-semibold uppercase tracking-wider">
            <span>Touch Keypad</span>
            <span className="text-blue-400">Tap numbers on screen</span>
          </div>
          <div className="grid grid-cols-3 gap-2.5">
            {keys.map((k) => (
              <button
                key={k}
                type="button"
                onClick={() => {
                  if (k === 'C') handleClear();
                  else if (k === '⌫') handleBackspace();
                  else handleDigit(k);
                }}
                className={`h-12 flex items-center justify-center rounded-xl font-bold text-xl transition active:scale-95 shadow-sm border ${
                  k === 'C' 
                    ? 'bg-slate-800 hover:bg-red-500/20 text-red-400 border-slate-700 text-sm' 
                    : k === '⌫'
                    ? 'bg-slate-800 hover:bg-amber-500/20 text-amber-400 border-slate-700'
                    : 'bg-slate-800/90 hover:bg-blue-600 text-white border-slate-700 hover:border-blue-400 text-2xl'
                }`}
              >
                {k}
              </button>
            ))}
          </div>
        </div>
      );
    };

    const getPatientByIdentifier = (identifier, method) => {
      const storedList = getStoredPatientsLocal();
      const allPatients = [...storedList, ...KNOWN_PATIENTS_LIST];
      if (!identifier) return allPatients[0];
      const clean = identifier.replace(/[\s-]/g, '').toLowerCase();

      // 1. Safe Search with null checks
      if (method === 'aadhaar') {
        const match = allPatients.find(p => p && p.aadhaarNumber && p.aadhaarNumber.replace(/[\s-]/g, '').toLowerCase() === clean);
        if (match) return { ...match, method: 'aadhaar', identifier };
      } else if (method === 'abha') {
        const match = allPatients.find(p => 
          (p && p.abhaNumber && p.abhaNumber.replace(/[\s-]/g, '').toLowerCase() === clean) ||
          (p && p.abhaAddress && p.abhaAddress.toLowerCase() === clean)
        );
        if (match) return { ...match, method: 'abha', identifier };
      } else if (method === 'email') {
        const match = allPatients.find(p => 
          (p && p.email && p.email.toLowerCase() === clean) ||
          (p && p.abhaAddress && p.abhaAddress.toLowerCase() === clean)
        );
        if (match) return { ...match, method: 'email', identifier };
      }

      // 2. Global safe fallback across all fields
      const match = allPatients.find(p => 
        (p && p.aadhaarNumber && p.aadhaarNumber.replace(/[\s-]/g, '').toLowerCase() === clean) ||
        (p && p.abhaNumber && p.abhaNumber.replace(/[\s-]/g, '').toLowerCase() === clean) ||
        (p && p.abhaAddress && p.abhaAddress.toLowerCase() === clean) ||
        (p && p.mobile && p.mobile.replace(/[\s-]/g, '') === clean)
      );
      if (match) return { ...match, method, identifier };

      // 3. Dynamic patient record if not found in local arrays
      let dynamicRecord;
      if (method === 'aadhaar') {
        const formattedAadhaar = clean.length >= 12 
          ? `${clean.slice(0, 4)} ${clean.slice(4, 8)} ${clean.slice(8, 12)}`
          : identifier;
        dynamicRecord = {
          patientId: `PT-AADHAAR-${clean.slice(-4) || '9000'}`,
          patientName: `Aadhaar Record Holder (${formattedAadhaar})`,
          fullName: `Aadhaar Record Holder (${formattedAadhaar})`,
          aadhaarNumber: formattedAadhaar,
          abhaNumber: `14-${clean.slice(0, 4) || '1234'}-${clean.slice(4, 8) || '5678'}-9000`,
          abhaAddress: `aadhaar.${clean.slice(-4) || '9000'}@abdm`,
          mobile: `9810${clean.slice(-6) || '900000'}`,
          email: `aadhaar.${clean.slice(-4) || '9000'}@abdm.gov.in`,
          age: 45,
          gender: "Male",
          address: "Verified Aadhaar Location",
          symptoms: "General OPD Consultation",
          tokenNumber: `OPD-AD-${clean.slice(-3) || '900'}`,
          queuePosition: 2,
          department: "General Medicine (Room 104)",
          vitals: { bp: "122/80 mmHg", pulse: "74 bpm", spo2: "99%", temp: "98.4 °F" }
        };
      } else if (method === 'abha') {
        dynamicRecord = {
          patientId: `PT-ABHA-${clean.slice(-4) || '9012'}`,
          patientName: `ABHA Profile Holder (${identifier})`,
          fullName: `ABHA Profile Holder (${identifier})`,
          abhaNumber: identifier,
          abhaAddress: identifier.includes('@') ? identifier : `${clean.slice(0, 6)}@abdm`,
          aadhaarNumber: `9876 5432 ${clean.slice(-4) || '1098'}`,
          mobile: `9876${clean.slice(-6) || '543210'}`,
          email: identifier.includes('@') ? identifier : `${clean}@abdm.gov.in`,
          age: 38,
          gender: "Female",
          address: "ABDM Verified Residence",
          symptoms: "ABHA OPD Check-Up",
          tokenNumber: `OPD-AB-${clean.slice(-3) || '018'}`,
          queuePosition: 1,
          department: "General Medicine (Room 105)",
          vitals: { bp: "118/76 mmHg", pulse: "72 bpm", spo2: "98%", temp: "98.6 °F" }
        };
      } else {
        dynamicRecord = {
          patientId: `PT-USER-${Date.now().toString().slice(-4)}`,
          patientName: `Verified Patient (${identifier})`,
          fullName: `Verified Patient (${identifier})`,
          identifier,
          method,
          abhaAddress: `${clean}@abdm`,
          email: identifier.includes('@') ? identifier : `${clean}@abdm.gov.in`,
          age: 40,
          gender: "Male",
          tokenNumber: "OPD-A-042",
          queuePosition: 2,
          department: "General Medicine (Room 104)",
          vitals: { bp: "120/80 mmHg", pulse: "75 bpm", spo2: "98%", temp: "98.6 °F" }
        };
      }

      // dynamic fallback preview only
      return dynamicRecord;
    };

    // Biometric Scanner Modal
    const BiometricModal = ({ isOpen, onClose, aadhaarNumber, onVerified, langDict }) => {
      const [scanning, setScanning] = useState(false);
      const [progress, setProgress] = useState(0);
      const [isSuccess, setIsSuccess] = useState(false);

      useEffect(() => {
        if (!isOpen) {
          setScanning(false);
          setProgress(0);
          setIsSuccess(false);
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleStartScan = () => {
        if (scanning || isSuccess) return;
        setScanning(true);
        setProgress(10);
        playChime(500);

        let current = 10;
        const interval = setInterval(() => {
          current += 15;
          if (current >= 100) {
            clearInterval(interval);
            setProgress(100);
            setScanning(false);
            setIsSuccess(true);
            playChime(800);



            setTimeout(() => { const pt = getPatientByIdentifier(aadhaarNumber || "5481 9023 1184", "aadhaar"); onVerified(pt); }, 1200);
          } else {
            setProgress(current);
            playChime(550 + current * 2, 0.04);
          }
        }, 250);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn">
          <div className="bg-white text-slate-800 w-full max-w-md rounded-3xl shadow-2xl border border-slate-200 overflow-hidden relative text-center">
            
            <div className="bg-slate-900 text-white p-6 relative">

            <div className="p-8 flex flex-col items-center justify-center">
              <div
                onClick={handleStartScan}
                className={`w-44 h-44 rounded-3xl cursor-pointer flex flex-col items-center justify-center relative overflow-hidden transition-all duration-300 ${
                  isSuccess 
                    ? 'bg-emerald-50 border-4 border-emerald-500 shadow-emerald-200' 
                    : scanning
                    ? 'bg-blue-900 border-4 border-blue-400 shadow-2xl shadow-blue-500/50 scale-105'
                    : 'bg-slate-900 border-4 border-slate-700 hover:border-blue-500 shadow-xl'
                }`}
              >
                {scanning && (
                  <div className="absolute inset-x-0 h-1.5 bg-cyan-400 shadow-[0_0_15px_#22d3ee] animate-scan z-10"></div>
                )}

                {isSuccess ? (
                  <Icon name="check" size={80} className="text-emerald-500 animate-bounce" />
                ) : (
                  <Icon 
                    name="fingerprint" 
                    size={88} 
                    className={`transition-colors duration-300 ${
                      scanning ? 'text-cyan-400 animate-pulse' : 'text-slate-400'
                    }`} 
                  />
                )}

                {scanning && (
                  <div className="absolute bottom-2 text-cyan-300 font-mono text-xs font-bold bg-slate-950/80 px-2.5 py-0.5 rounded-full">
                    {progress}%
                  </div>
                )}
              </div>

              <div className="mt-6">
                {isSuccess ? (
                  <div className="text-emerald-700 font-bold text-lg">
                    {langDict.matchSuccess}
                  </div>
                ) : scanning ? (
                  <div className="text-blue-600 font-semibold text-lg animate-pulse flex items-center justify-center gap-2">
                    <div className="w-3 h-3 bg-blue-600 rounded-full animate-ping"></div>
                    <span>{langDict.scanningText}</span>
                  </div>
                ) : (
                  <div>
                    <button
                      type="button"
                      onClick={handleStartScan}
                      className="px-6 py-3 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-xl text-lg shadow-md transition"
                    >
                      Tap to Start Biometric Scan
                    </button>
                    <p className="text-xs text-slate-400 mt-2">Simulates UIDAI STQC certified optical biometric sensor</p>
                  </div>
                )}
              </div>

              <div className="mt-6 pt-4 border-t border-slate-100 w-full flex items-center justify-center text-xs text-slate-500 gap-1.5">
                <Icon name="shield-check" size={16} className="text-blue-600" />
                <span>UIDAI Biometric Authentication Protocol v2.5</span>
              </div>
            </div>

          </div>
        </div>
      );
    };

    // New Patient Registration Modal (Aadhaar, ABHA, Manual Form)

      // OTP Verification States
      const [isOtpStep, setIsOtpStep] = useState(false);

        }
        setAadhaarNumber(f);
      };

      const handleAbhaChange = (val) => {
        setErrorMsg('');
        const clean = val.replace(/\D/g, '').slice(0, 14);

          f += clean[i];
        }

      const handleQuickDemoFill = () => {

            email: 'medikiosk31@gmail.com',
            symptoms: 'Cough and headache for 2 days'
          });
        }

      const handleBiometricScan = () => {
        playChime(600);
        setBiometricScanning(true);
        setErrorMsg('');
        setTimeout(() => {

          setAadhaarNumber('5481 9023 1184');
          setFormData({
            fullName: 'Sanjay Balwantrao Shinde',
            age: '51',

            mobile: '9822334455',
            email: 'sanjay.shinde@abdm.gov.in',
            symptoms: 'Routine OPD Consultation'
          });
          playChime(800);
        }, 1500);
      };

      // Step 1: Send Live Email OTP
      const handleInitiateRegistration = async (e) => {
        if (e) e.preventDefault();
        playChime(600);
        setErrorMsg('');

        if (regMode === 'aadhaar') {
          const clean = aadhaarNumber.replace(/\s/g, '');
          if (clean.length !== 12) {
            playChime(350);
            setErrorMsg('Please enter a valid 12-digit Aadhaar Number or use Fingerprint scan.');
            return;
          }
        } else if (regMode === 'abha') {
          const clean = abhaNumber.replace(/-/g, '');
          if (clean.length !== 14) {
            playChime(350);
            setErrorMsg('Please enter a valid 14-digit ABHA Number.');
            return;
          }
        }

        if (!formData.fullName || !formData.age || !formData.mobile || !formData.email) {
          playChime(350);
          setErrorMsg('Please fill in Full Name, Age, 10-digit Mobile, and Email Address.');
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(formData.email.trim())) {
          playChime(350);
          setErrorMsg('Please enter a valid email address (e.g. name@example.com).');
          return;
        }

        setIsSendingOtp(true);
        try {
          const resp = await fetch('http://127.0.0.1:8000/api/v1/patient/send-email-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: formData.email.trim(),
              fullName: formData.fullName.trim()
            })
          });
          const data = await resp.json();
          setIsSendingOtp(false);
          if (resp.ok && data.success) {
            setIsOtpStep(true);
            playChime(800);
          } else {
            setIsOtpStep(true);
            playChime(800);
          }
        } catch (err) {
          console.warn("Backend OTP API fallback:", err);
          setIsSendingOtp(false);
          setIsOtpStep(true);
          playChime(800);
        }
      };

      // Step 2: Verify OTP & Complete Registration
      const handleVerifyOtpAndRegister = async (e) => {
        if (e) e.preventDefault();
        playChime(600);
        setErrorMsg('');

        const cleanOtp = otpCode.trim();
        if (!cleanOtp || cleanOtp.length < 6) {
          playChime(350);
          setErrorMsg('Please enter the 6-digit verification code sent to your email.');
          return;
        }

        setIsVerifyingOtp(true);
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 4000);
          const resp = await fetch('http://127.0.0.1:8000/api/v1/patient/verify-email-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              email: formData.email.trim(),
              code: cleanOtp,
              otp: cleanOtp
            })
          });
          clearTimeout(timer);
          const data = await resp.json();
          if (!resp.ok || !data.success) {
            setIsVerifyingOtp(false);
            playChime(350);
            setErrorMsg(data.error || 'Invalid verification code. Please check your email inbox.');
            return;
          }
        } catch (err) {
          console.warn("Backend verification fallback:", err);
          if (cleanOtp.length !== 6) {
            setIsVerifyingOtp(false);
            playChime(350);
            setErrorMsg('Invalid verification code. Code must be 6 digits.');
            return;
          }
        }

        const generatedAbha = regMode === 'abha' && abhaNumber
          ? abhaNumber
          : `14-${Math.floor(1000 + Math.random() * 9000)}-${Math.floor(1000 + Math.random() * 9000)}-${Math.floor(1000 + Math.random() * 9000)}`;

          method: regMode === 'aadhaar' ? 'aadhaar_registration' : regMode === 'abha' ? 'abha_linking' : 'new_registration',
          identifier: generatedAbha,
          patientName: formData.fullName,
          fullName: formData.fullName,
          abhaNumber: generatedAbha,
          aadhaarNumber: aadhaarNumber || `1234 ${Math.floor(1000 + Math.random() * 9000)} ${Math.floor(1000 + Math.random() * 9000)}`,
          abhaAddress: `${formData.fullName.toLowerCase().replace(/\s+/g, '.')}${Math.floor(10 + Math.random() * 89)}@abdm`,
          email: formData.email.trim(),
          age: parseInt(formData.age, 10) || 30,
          gender: formData.gender,
          mobile: formData.mobile,
          tokenNumber: `OPD-N-0${Math.floor(10 + Math.random() * 89)}`,
          queuePosition: 1,
          isNewRegistration: true,
          department: formData.symptoms || "General Medicine (Room 104)"
        };

        // Save to SQLite and MongoDB Cloud Store via backend endpoint
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 3000);
          const regResp = await fetch('http://127.0.0.1:8000/api/v1/patient/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify(newPatient)
          });
          clearTimeout(timer);
          const regData = await regResp.json();
          if (regData && regData.patient) {
            newPatient = { ...newPatient, ...regData.patient };
          }
          if (regData && regData.ticket) {
            newPatient.tokenNumber = regData.ticket.tokenNumber || newPatient.tokenNumber;
            newPatient.ticketId = regData.ticket.ticketId;
            newPatient.doctorName = regData.ticket.doctorName;
            newPatient.roomNumber = regData.ticket.roomNumber;
          }
        } catch (e) {
          console.warn("Patient register sync fallback:", e);
        }

        // Save locally to storage
        try {
          saveRegisteredPatient(newPatient);
        } catch (e) {
          console.warn("Local storage save warning:", e);
        }

        setIsVerifyingOtp(false);
        setSuccessData(newPatient);
        playChime(900);

        setTimeout(() => {
          onRegistered(newPatient);
        }, 1200);
      };

      return (

    // Main Login Kiosk Component
    function LoginKiosk({ onReturnToMenu, onOpenAdmin }) {
      const [loginMethod, setLoginMethod] = useState('abha');
      const [language, setLanguage] = useState('english');
      const [inputValue, setInputValue] = useState('');
      const [consentGranted, setConsentGranted] = useState(false);
      const [showNumpad, setShowNumpad] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      
      // Modals
      const [isOtpOpen, setIsOtpOpen] = useState(false);
      const [isBiometricOpen, setIsBiometricOpen] = useState(false);
      const [isNewPatientOpen, setIsNewPatientOpen] = useState(false);
      const [isConsentDetailsOpen, setIsConsentDetailsOpen] = useState(false);
      
      // Patient State
      const [authenticatedPatient, setAuthenticatedPatient] = useState(null);
      const [errorMessage, setErrorMessage] = useState('');

      const langDict = translations[language] || translations.english;

      const handleAudioGuide = () => {
        playChime(650);
        if (isSpeaking) {
          stopSpeech();
          setIsSpeaking(false);
          return;
        }

        let speechText = langDict.speechIntro;
        if (loginMethod === 'abha') speechText = `${langDict.speechAbha} ${langDict.speechConsent}`;
        else if (loginMethod === 'aadhaar') speechText = `${langDict.speechAadhaar} ${langDict.speechConsent}`;

        speakText(speechText, language, () => setIsSpeaking(true), () => setIsSpeaking(false));
      };

      const handleMethodChange = (method) => {
        playChime(550);
        setLoginMethod(method);
        setInputValue('');
        setErrorMessage('');
      };

      const handleInputChange = (rawVal) => {
        setErrorMessage('');
        const clean = rawVal.replace(/\D/g, '');

        if (loginMethod === 'abha') {
          const trunc = clean.slice(0, 14);
          let f = '';
          for (let i = 0; i < trunc.length; i++) {
            if (i === 2 || i === 6 || i === 10) f += '-';
            f += trunc[i];
          }
          setInputValue(f);
        } else {
          const trunc = clean.slice(0, 12);
          let f = '';
          for (let i = 0; i < trunc.length; i++) {
            if (i > 0 && i % 4 === 0) f += ' ';
            f += trunc[i];
          }
          setInputValue(f);
        }
      };

      const handleDemoFill = (type) => {
        playChime(700);
        if (type === 'abha') {
          setLoginMethod('abha');
          setInputValue('14-8892-4412-9031');
          setConsentGranted(true);
          setErrorMessage('');
        } else if (type === 'aadhaar') {
          setLoginMethod('aadhaar');
          setInputValue('5481 9023 1184');
          setConsentGranted(true);
          setErrorMessage('');
        }
      };

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        playChime(600);

        if (!consentGranted) {
          playChime(320);
          setErrorMessage(langDict.validationErrorConsent);
          return;
        }

        const clean = inputValue.replace(/[\s-]/g, '');
        if (!clean) {
          playChime(320);
          setErrorMessage(langDict.validationErrorRequired);
          return;
        }

        if (loginMethod === 'abha' && clean.length !== 14) {
          playChime(320);
          setErrorMessage(langDict.validationErrorAbha);
          return;
        }

        if (loginMethod === 'aadhaar' && clean.length !== 12) {
          playChime(320);
          setErrorMessage(langDict.validationErrorAadhaar);
          return;
        }

        setIsOtpOpen(true);
      };

      const handleVerified = (patient) => {
        setIsOtpOpen(false);
        setIsBiometricOpen(false);
        setIsNewPatientOpen(false);
        setAuthenticatedPatient(patient);
        playChime(900);
        


        const welcomeVoice = language === 'hindi' 
          ? `नमस्ते ${patient.patientName}, आपका सत्यापन सफल हुआ। आपका ओपीडी टोकन नंबर ${patient.tokenNumber} है।`
          : language === 'marathi'
          ? `नमस्कार ${patient.patientName}, आपले सत्यापन पूर्ण झाले आहे. आपला ओपीडी टोकन नंबर ${patient.tokenNumber} आहे.`
          : `Welcome ${patient.patientName}, check-in successful. Your OPD Token is ${patient.tokenNumber}.`;

        speakText(welcomeVoice, language);
      };

      const handleLogout = () => {
        playChime(500);
        setAuthenticatedPatient(null);
        setInputValue('');
        setConsentGranted(false);
        setShowNumpad(false);
        stopSpeech();
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-100 via-blue-50 to-indigo-100 text-slate-800 flex flex-col items-center justify-between p-4 sm:p-6 font-sans relative overflow-x-hidden selection:bg-blue-600 selection:text-white">
          
          {/* Soft Decorative Ambient Lights */}
          <div className="absolute top-0 left-1/4 w-96 h-96 bg-blue-300/30 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-0 right-1/4 w-96 h-96 bg-cyan-300/30 rounded-full blur-3xl pointer-events-none"></div>

          {/* Medical Doodle Theme Background (Caduceus & Medical Elements) */}
          <MedicalDoodleBackground />

          {/* Header */}
          <header className="w-full max-w-5xl flex flex-wrap justify-between items-center gap-4 z-10 py-2">
            <div className="flex items-center space-x-3.5">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-500 p-0.5 shadow-lg shadow-blue-500/20 flex items-center justify-center">
                <div className="w-full h-full bg-white rounded-[14px] flex items-center justify-center shadow-inner">
                  <Icon name="activity" size={26} className="text-blue-600 animate-pulse" />
                </div>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-950 via-slate-900 to-blue-800 bg-clip-text text-transparent">
                    {langDict.hospitalName}
                  </h1>
                  <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-blue-600/10 text-blue-700 border border-blue-600/30 shadow-sm">
                    ABDM 2.0
                  </span>
                </div>
                <p className="text-xs text-slate-600 font-medium hidden sm:block">
                  {langDict.kioskTagline}
                </p>
              </div>
            </div>

            {/* Language & Voice Controls */}
            <div className="flex items-center space-x-2.5">
              {isSpeaking && (
                <div className="flex items-center gap-1 px-3 py-1.5 bg-blue-600/10 border border-blue-500/30 rounded-xl text-blue-800 text-xs font-semibold animate-pulse shadow-sm">
                  <div className="w-1.5 h-3 bg-blue-600 rounded-full equalizer-bar"></div>
                  <div className="w-1.5 h-5 bg-blue-600 rounded-full equalizer-bar" style={{ animationDelay: '0.2s' }}></div>
                  <div className="w-1.5 h-2 bg-blue-600 rounded-full equalizer-bar" style={{ animationDelay: '0.4s' }}></div>
                  <span className="ml-1 hidden sm:inline">{langDict.audioPlayingText}</span>
                </div>
              )}

              <div className="relative flex items-center">
                <Icon name="globe" size={18} className="absolute left-3.5 text-slate-500 pointer-events-none" />
                <select 
                  value={language}
                  onChange={(e) => setLanguage(e.target.value)}
                  className="bg-white/95 text-slate-800 text-base font-semibold rounded-2xl pl-10 pr-8 py-2.5 border border-blue-200 hover:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 shadow-md cursor-pointer transition"
                >
                  <option value="english">English</option>
                  <option value="hindi">हिंदी (Hindi)</option>
                  <option value="marathi">मराठी (Marathi)</option>
                </select>
              </div>

              <button
                type="button"
                onClick={() => {
                  playChime(300);
                  alert("🚨 Emergency SOS Triggered: Staff and triage nurse have been notified at Gate 02.");
                }}
                className="flex items-center space-x-1.5 px-3.5 py-2.5 bg-red-50 hover:bg-red-100 text-red-700 border border-red-300 rounded-2xl text-xs font-bold transition active:scale-95 shadow-md"
              >
                <Icon name="shield-alert" size={18} className="text-red-600" />
                <span className="hidden sm:inline">SOS</span>
              </button>

                            {/* Admin Portal Button */}
              {onOpenAdmin && (
                <button
                  type="button"
                  onClick={() => {
                    playChime(600);
                    onOpenAdmin();
                  }}
                  className="flex items-center space-x-1.5 px-3.5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white border border-slate-700 rounded-2xl text-xs font-bold transition active:scale-95 shadow-md"
                  title="Hospital Admin & Analytics"
                >
                  <Icon name="bar-chart" size={16} className="text-cyan-400" />
                  <span className="hidden md:inline">Admin Portal</span>
                </button>
              )}

              {/* Return to Role Selection Button */}
              {onReturnToMenu && (
                <button
                  type="button"
                  onClick={() => {
                    playChime(600);
                    onReturnToMenu();
                  }}
                  className="flex items-center space-x-1.5 px-3 py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-2xl text-xs font-bold transition shadow-sm active:scale-95"
                  title="Return to Main Role Selection"
                >
                  <span>← Main Menu</span>
                </button>
              )}
            </div>
          </header>

          {/* Main Area */}
          <main className="w-full max-w-5xl my-auto py-4 z-10">
            {authenticatedPatient ? (
              <PatientDashboard patient={authenticatedPatient} onLogout={handleLogout} language={language} />
            ) : (
              /* Main Screen */
              <div className="w-full bg-white text-slate-800 rounded-3xl shadow-2xl shadow-blue-500/10 overflow-hidden flex flex-col md:flex-row border border-blue-100/80">
                
                {/* Left Panel */}
                <div className="bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 text-white p-8 md:w-5/12 flex flex-col justify-between relative overflow-hidden">
                  <div>
                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-white/15 backdrop-blur-md rounded-full text-xs font-semibold text-blue-100 mb-6 border border-white/20">
                      <Icon name="sparkles" size={14} className="text-yellow-300" />
                      <span>Audio-Assisted Smart Kiosk</span>
                    </div>

                    <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight mb-4">
                      {langDict.welcomeTitle}
                    </h2>
                    
                    <p className="text-blue-100 text-base sm:text-lg mb-8 leading-relaxed">
                      {langDict.welcomeSubtitle}
                    </p>
                  </div>

                  <div className="space-y-4">
                    <button 
                      type="button"
                      onClick={handleAudioGuide}
                      className={`w-full flex items-center space-x-3.5 p-4 rounded-2xl text-left transition shadow-md ${
                        isSpeaking ? 'bg-emerald-500 text-white' : 'bg-white/15 hover:bg-white/25 text-white'
                      }`}
                    >
                      <div className="p-2.5 rounded-xl bg-white/20">
                        <Icon name={isSpeaking ? "volume-x" : "volume"} size={26} />
                      </div>
                      <div>
                        <span className="block text-base sm:text-lg font-bold leading-tight">
                          {isSpeaking ? "Tap to Stop Voice" : langDict.audioButtonText}
                        </span>
                        <span className="text-xs text-blue-200">
                          {language === 'hindi' ? "हिंदी आवाज़ में निर्देश" : language === 'marathi' ? "मराठी आवाज मार्गदर्शन" : "Voice guide in selected language"}
                        </span>
                      </div>
                    </button>

                    <div className="pt-2">
                      <div className="text-xs text-blue-200 font-semibold mb-2">Quick Demo Login:</div>
                      <div className="flex flex-wrap gap-2">
                        <button
                          type="button"
                          onClick={() => handleDemoFill('abha')}
                          className="px-3 py-1.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-xs font-medium text-blue-100 transition"
                        >
                          ⚡ {langDict.quickDemoAbha}
                        </button>
                        <button
                          type="button"
                          onClick={() => handleDemoFill('aadhaar')}
                          className="px-3 py-1.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-xs font-medium text-blue-100 transition"
                        >
                          ⚡ {langDict.quickDemoAadhaar}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Right Panel */}
                <div className="p-6 sm:p-8 md:w-7/12 flex flex-col justify-between bg-white space-y-6">
                  
                  <div>
                    {/* SECTION 1: Existing Patient Login (ABHA ID / Aadhaar) */}
                    <div className="pb-6 border-b border-slate-200">
                      
                      <div className="flex items-center justify-between mb-4">
                        <div>
                          <h3 className="text-lg font-extrabold text-slate-800">
                            {langDict.existingPatientTitle || "Existing Patient Login"}
                          </h3>
                          <p className="text-xs text-slate-500">
                            {langDict.existingPatientSubtitle || "Enter ABHA ID or Aadhaar Number for instant OPD Check-In"}
                          </p>
                        </div>

                        <button
                          type="button"
                          onClick={() => {
                            playChime(600);
                            setShowNumpad(!showNumpad);
                          }}
                          className="text-xs text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1 px-2.5 py-1.5 bg-blue-50 rounded-xl border border-blue-200 transition"
                        >
                          <Icon name="keypad" size={14} />
                          <span>{showNumpad ? langDict.numpadToggleClose : langDict.numpadToggleOpen}</span>
                        </button>
                      </div>

                      {/* Switcher Tabs: ABHA ID vs Aadhaar */}
                      <div className="grid grid-cols-2 gap-1.5 sm:gap-2 mb-4 p-1 bg-slate-100 rounded-2xl border border-slate-200">
                        <button
                          type="button"
                          onClick={() => handleMethodChange('abha')}
                          className={`flex items-center justify-center space-x-1.5 sm:space-x-2 py-3 rounded-xl font-bold text-xs sm:text-sm transition ${
                            loginMethod === 'abha'
                              ? 'bg-white text-blue-700 shadow-md ring-2 ring-blue-500/20'
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <Icon name="credit-card" size={17} className={loginMethod === 'abha' ? 'text-blue-600' : 'text-slate-400'} />
                          <span className="truncate">{langDict.tabAbha}</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => handleMethodChange('aadhaar')}
                          className={`flex items-center justify-center space-x-1.5 sm:space-x-2 py-3 rounded-xl font-bold text-xs sm:text-sm transition ${
                            loginMethod === 'aadhaar'
                              ? 'bg-white text-blue-700 shadow-md ring-2 ring-blue-500/20'
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <Icon name="fingerprint" size={17} className={loginMethod === 'aadhaar' ? 'text-blue-600' : 'text-slate-400'} />
                          <span className="truncate">{langDict.tabAadhaar}</span>
                        </button>
                      </div>

                      <form onSubmit={handleLogin} className="space-y-3.5">
                        <div>
                          <label className="block text-xs sm:text-sm font-bold text-slate-700 mb-1">
                            {loginMethod === 'abha' ? langDict.labelAbha : langDict.labelAadhaar}
                          </label>
                          <div className="relative">
                            <input
                              type="text"
                              inputMode="numeric"
                              value={inputValue}
                              onChange={(e) => handleInputChange(e.target.value)}
                              placeholder={loginMethod === 'abha' ? langDict.placeholderAbha : langDict.placeholderAadhaar}
                              className="w-full text-xl sm:text-2xl font-mono font-bold tracking-widest px-4 py-3.5 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:outline-none focus:border-blue-600 focus:bg-white text-slate-800 transition"
                            />
                            {inputValue && (
                              <button
                                type="button"
                                onClick={() => setInputValue('')}
                                className="absolute right-3.5 top-4 text-slate-400 hover:text-slate-600 p-1"
                              >
                                ✕
                              </button>
                            )}
                          </div>
                        </div>

                        {loginMethod === 'aadhaar' && (
                          <div>
                            <button
                              type="button"
                              onClick={() => {
                                playChime(600);
                                setIsBiometricOpen(true);
                              }}
                              className="w-full py-2.5 px-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition shadow"
                            >
                              <Icon name="fingerprint" size={18} className="text-cyan-400" />
                              <span>{langDict.biometricScanBtn}</span>
                            </button>
                          </div>
                        )}

                        {showNumpad && (
                          <div className="mt-3">
                            <TouchNumpad
                              value={inputValue}
                              onChange={(val) => setInputValue(val)}
                              maxLength={loginMethod === 'abha' ? 14 : 12}
                              formatType={loginMethod === 'abha' ? 'abha' : 'aadhaar'}
                            />
                          </div>
                        )}

                        {errorMessage && (
                          <div className="p-3 bg-red-50 border border-red-200 text-red-700 text-xs sm:text-sm rounded-xl font-medium">
                            ⚠️ {errorMessage}
                          </div>
                        )}

                        <div className="flex items-start space-x-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                          <input
                            type="checkbox"
                            id="consent"
                            checked={consentGranted}
                            onChange={(e) => {
                              playChime(500);
                              setConsentGranted(e.target.checked);
                              if (errorMessage) setErrorMessage('');
                            }}
                            className="w-5 h-5 text-blue-600 bg-white border-2 border-slate-300 rounded-lg cursor-pointer mt-0.5 shrink-0"
                          />
                          <label htmlFor="consent" className="text-slate-600 text-xs cursor-pointer leading-snug">
                            {langDict.consentLabel}
                            <button 
                              type="button" 
                              onClick={() => setIsConsentDetailsOpen(true)}
                              className="text-blue-600 font-bold hover:underline ml-1"
                            >
                              {langDict.viewDetails}
                            </button>
                          </label>
                        </div>

                        <button
                          type="submit"
                          className="w-full flex items-center justify-center space-x-2 text-white text-lg font-bold py-3.5 px-6 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] transition shadow-lg shadow-blue-500/20"
                        >
                          <span>{langDict.btnContinue}</span>
                          <Icon name="arrow-right" size={20} />
                        </button>
                      </form>
                    </div>

                    {/* SECTION 2: New Patient Registration Banner */}
                    <div className="mt-5 p-5 bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-50 border-2 border-emerald-200 rounded-3xl shadow-sm">
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-center space-x-3">
                          <div className="p-2.5 bg-emerald-600 text-white rounded-2xl shadow-md">
                            <Icon name="user-plus" size={24} />
                          </div>
                          <div>
                            <h3 className="text-lg font-extrabold text-emerald-950">
                              {langDict.newPatientBannerTitle}
                            </h3>
                            <p className="text-xs text-emerald-800 mt-0.5">
                              {langDict.newPatientBannerDesc}
                            </p>
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2 mt-3 text-xs text-emerald-900 font-medium">
                        <div className="flex items-center gap-1.5">
                          <Icon name="check" size={15} className="text-emerald-600 font-bold shrink-0" />
                          <span>Aadhaar e-KYC / Thumb scan</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <Icon name="check" size={15} className="text-emerald-600 font-bold shrink-0" />
                          <span>Instant 14-digit ABHA Creation</span>
                        </div>
                      </div>

                      <button
                        type="button"
                        onClick={() => {
                          playChime(600);
                          setIsNewPatientOpen(true);
                        }}
                        className="w-full mt-4 py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl transition shadow-md flex items-center justify-center gap-2 active:scale-95 text-base"
                      >
                        <Icon name="user-plus" size={20} />
                        <span>{langDict.btnStartReg}</span>
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                    <div className="flex items-center gap-1.5">
                      <Icon name="shield-check" size={16} className="text-emerald-600" />
                      <span className="text-[11px] sm:text-xs text-slate-500 font-medium">{langDict.dpdpBadge}</span>
                    </div>
                    <span className="font-mono text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 font-medium">
                      TLS 1.3 AES-256
                    </span>
                  </div>

                </div>

              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="w-full max-w-5xl flex flex-wrap justify-between items-center text-xs text-slate-600 py-3 border-t border-blue-200/80 gap-2 z-10 font-medium">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
              <span>{langDict.kioskLocation}</span>
            </div>
            <span>ABDM Helpline: <strong className="text-slate-800 font-bold">14477 (Toll-Free)</strong></span>
          </footer>

          {/* OTP Modal */}
          {isOtpOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="bg-white text-slate-800 w-full max-w-md rounded-3xl shadow-2xl p-6 border border-slate-200 text-center">
                <h3 className="text-2xl font-bold">{langDict.otpModalTitle}</h3>
                <p className="text-slate-500 text-sm mt-1">{langDict.otpModalSubtitle}</p>
                <div className="my-6 p-4 bg-blue-50 border border-blue-200 rounded-2xl font-mono text-3xl tracking-widest font-bold text-blue-900">
                  1 2 3 4 5 6
                </div>
                <div className="text-xs text-slate-400 mb-6">{langDict.otpDemoCode} (Auto-filled)</div>
                <div className="flex gap-3">
                  <button
                    onClick={() => setIsOtpOpen(false)}
                    className="w-1/2 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={async () => {
                      try {
                        const res = await fetch('http://127.0.0.1:8000/api/v1/patient/verify-identifier', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ identifier: inputValue, loginMethod })
                        });
                        const data = await res.json();
                        if (data && data.patient) {
                          handleVerified(data.patient);
                          return;
                        }
                      } catch (e) {
                        console.warn('Backend lookup bridge skipped', e);
                      }
                      handleVerified(getPatientByIdentifier(inputValue, loginMethod));
                    }}
                    className="w-1/2 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow"
                  >
                    {langDict.verifyOtpBtn}

                </div>
              </div>
            </div>
          )}

          body: JSON.stringify(record)

    // Root MediKiosk App Component (Supporting Patient Kiosk, Doctor Portal, and Admin Portal with Strict Role Isolation)
    function App() {
      // 'landing' | 'patient' | 'doctor' | 'admin'
      const [portalMode, setPortalMode] = useState('landing');
      const [authenticatedDoctor, setAuthenticatedDoctor] = useState(null);
      const [authenticatedAdmin, setAuthenticatedAdmin] = useState(null);

      const handleReturnToMenu = () => {
        playChime(600);
        setAuthenticatedDoctor(null);
        setAuthenticatedAdmin(null);
        setPortalMode('landing');
      };

      return (
        <div className="w-full min-h-screen relative font-sans">
          
          {/* Starting Role Selection Screen */}
          {portalMode === 'landing' && (
            <RoleSelectionLanding 
              onSelectRole={(role) => setPortalMode(role)} 
            />
          )}

          {/* 1. Patient Portal (Strictly Isolated) */}
          {portalMode === 'patient' && (
            <LoginKiosk 
              onReturnToMenu={handleReturnToMenu} 
              onOpenAdmin={() => setPortalMode('admin')}
            />
          )}

          {/* 2. Doctor Portal (Strictly Isolated) */}
          {portalMode === 'doctor' && (
            authenticatedDoctor ? (
              <PhysicianDashboard 
                doctor={authenticatedDoctor} 
                onLogout={() => setAuthenticatedDoctor(null)}
                onReturnToMenu={handleReturnToMenu}
              />
            ) : (
              <DoctorLogin 
                onLoginSuccess={(doc) => setAuthenticatedDoctor(doc)}
                onReturnToMenu={handleReturnToMenu}
              />
            )
          )}

          {/* 3. Hospital Admin Portal (Strictly Isolated) */}
          {portalMode === 'admin' && (
            authenticatedAdmin ? (
              <AdminDashboard
                admin={authenticatedAdmin}
                onLogout={() => setAuthenticatedAdmin(null)}
                onReturnToMenu={handleReturnToMenu}
              />
            ) : (
              <AdminLogin
                onLoginSuccess={(adm) => setAuthenticatedAdmin(adm)}
                onReturnToMenu={handleReturnToMenu}
              />
            )
          )}

        </div>
      );
    }

    // Mount React App
    try {
      const rootElement = document.getElementById('root');
      if (rootElement && window.ReactDOM && window.React) {
        ReactDOM.createRoot(rootElement).render(<App />);
      }
    } catch (err) {
      console.error("React mount error:", err);
      document.getElementById('root').innerHTML = `
        <div style="padding: 2rem; color: red; font-family: sans-serif;">
          <h2>Application Initialization Error</h2>
          <pre>${err.message}</pre>
        </div>
      `;
